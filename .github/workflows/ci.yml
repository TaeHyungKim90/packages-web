name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    tags:
      - "v*.*.*"

jobs:
  linter:
    name: Lint
    runs-on: [self-hosted]
    container: nexus.sk-inc.com:8081/cr/cloud-ops-builder:v1.0.4

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore uv cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}

      - name: Restore npm cache
        uses: actions/cache@v5
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: |
          cd backend && uv sync --frozen
          cd ../frontend && npm ci
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> $GITHUB_PATH

      - name: Run lint
        run: make lint

      - name: Run type check
        run: make type-check

  tester:
    name: Test
    needs: linter
    runs-on: [self-hosted]
    container: nexus.sk-inc.com:8081/cr/cloud-ops-builder:v1.0.4

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore uv cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}

      - name: Restore npm cache
        uses: actions/cache@v5
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: |
          cd backend && uv sync --frozen
          cd ../frontend && npm ci
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> $GITHUB_PATH

      - name: Run tests
        run: make test

  sbom:
    name: SBOM (${{ matrix.target.name }})
    needs: tester
    strategy:
      matrix:
        target:
          - path: backend
            name: packages-web-backend
          - path: frontend
            name: packages-web-frontend
    uses: ./.github/workflows/sbom.yml
    with:
      PROJECT_PATH: ${{ matrix.target.path }}
      PROJECT_NAME: ${{ matrix.target.name }}
      IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('pr-{0}', github.event.pull_request.number) }}
